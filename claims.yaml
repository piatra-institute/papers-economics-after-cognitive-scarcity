- id: bainbridge-support
  kind: source
  passage: Bainbridge's analysis of automation considers systems in which a person must take over under
    abnormal conditions and notes that automation removes the routine practice that keeps that person
    capable [@bainbridge1983].
  evidence:
    citation_id: bainbridge1983
    locator: Automatica 19(6), 775-779, on the monitoring and takeover role
    verified: true
    verification_note: Identity confirmed against Crossref (DOI 10.1016/0005-1098(83)90046-8). The paper's
      argument concerns systems where the operator is retained to handle abnormal conditions, and the
      manuscript attributes only that to her, together with her recommendation of automatic shutdown where
      appropriate. It does not attribute to her any claim about the permanent superiority of human responders,
      which she does not make.
- id: endsley-support
  kind: source
  passage: The out-of-the-loop performance problem and its relation to the level of control in automation
    have been studied directly [@endsley1995].
  evidence:
    citation_id: endsley1995
    locator: Human Factors 37(2), 381-394; title and subject of the article
    verified: true
    verification_note: 'Identity confirmed against Crossref (DOI 10.1518/001872095779064555): Endsley
      and Kiris, ''The out-of-the-loop performance problem and level of control in automation'', Human
      Factors 37(2), 381-394, 1995. The full text and abstract could not be retrieved in this pass; the
      publisher returns 403 and neither Semantic Scholar nor Europe PMC holds an abstract. The manuscript
      was therefore rewritten to assert only what the title and subject establish, that the problem is
      named and studied in this literature, and it no longer attributes any specific experimental finding,
      sample or effect size to these authors.'
- id: acemoglu-conditional
  kind: source
  passage: Acemoglu and Restrepo model new tasks in which labour has a comparative advantage and state
    that their framework also includes a regime in which all tasks are automated [@acemoglu2018], and
    Autor's account of why many jobs persist is an argument about complementarity under stated conditions
    [@autor2015].
  evidence:
    citation_id: acemoglu2018
    locator: American Economic Review 108(6), 1488-1542, the task framework and its regimes
    verified: true
    verification_note: Identity confirmed against Crossref (DOI 10.1257/aer.20160696). The paper's task-based
      framework includes the creation of new labour-intensive tasks and analyses a full-automation regime
      among its cases. The manuscript cites this to credit the authors with stating their premises, and
      directs its criticism at the unconditional use of conditional results rather than at their model.
- id: free-cognition-premise
  kind: assumption
  passage: Every attainable cognitive service, at every quality, is free to develop, copy and run, and
    every person and institution has unrestricted access.
  rationale: The universal-access clause is separate from the zero-cost clause and is assumed deliberately,
    so that no inequality in the models can be attributed to unequal access to intelligence. Dropping
    it would give a different and easier paper in which concentration is explained by gatekeeping; keeping
    it forces the distributional results to come from ownership alone, which is the point being tested.
- id: task-units
  kind: assumption
  passage: The task model has no prices and therefore bounds an income share without computing one; its
    units are tasks.
  rationale: Tasks are counted, not valued. A model with wages would require an assumption about what
    a human-held task earns once its cognitive content is free, which is exactly the question at issue,
    so the paper reports the share of tasks and states that it is an upper bound on the share of income
    rather than silently converting one into the other.
- id: fallback-model-scope
  kind: interpretation
  passage: The fallback model prices a single class of incidents with stated success probabilities and
    no correlated cascades.
  rationale: This states a limit rather than a result. Real incident populations are heterogeneous and
    failures cascade; the model's value is that it makes the independence requirement explicit and computable,
    not that its numbers describe any real operation.
