web_blurb: Arguments about AI and work often assume that whatever machines cannot yet do is a lasting
  human domain. Three benchmark models show that equal access to intelligence does not narrow the distribution
  of consumption, and that the share of tasks people hold can fall toward zero even though some task always
  remains.
