abstract: 'Arguments about what artificial intelligence will do to work keep one thing fixed while everything
  else moves: the assumption that whatever machines cannot yet do is a durable human province. This paper
  calls that the permanent-remainder assumption and computes what it would take to be true. Under a counterfactual
  in which every attainable cognitive service is free and universally available, three benchmarks are
  solved. An exact two-good equilibrium with identical preferences and identical free cognition yields
  consumption ratios of 81 to 1, 9 to 1 or 1 to 1 between the same two groups depending only on ownership
  and pooling, so equal intelligence does not narrow the distribution at all. A task model then separates
  two propositions the usual argument runs together: the set of tasks people still hold can be nonempty
  at every date while their share of tasks converges to $\delta/(a+\delta)$, where $\delta$ is task turnover
  and $a$ the rate at which capability overtakes a new task. That limit does not depend on how fast new
  work appears, and a positive limit requires tasks needing something other than reasoning. Finally, the
  argument that automation must leave a human fallback holds across 84.85 percent of the plane of machine
  capability and failure independence and fails in a computable region, while past 50 percent automation
  of routine incidents an out-of-practice responder falls below plain containment. The paper''s limits
  are stated: these are benchmarks with no prices, no investment and no empirical calibration.'
